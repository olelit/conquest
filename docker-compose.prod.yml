name: conquest-prod
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conquest
      POSTGRES_PASSWORD: conquest
      POSTGRES_DB: conquest_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conquest -d conquest_db"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - conquest_network

  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: prod
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: conquest
      PGPASSWORD: conquest
      PGDATABASE: conquest_db
      # Admin панель (/admin): в проде обязательно задай эти переменные, особенно SECRET
      CONQUEST_ADMIN_USER: ${CONQUEST_ADMIN_USER:-admin}
      CONQUEST_ADMIN_PASSWORD: ${CONQUEST_ADMIN_PASSWORD:-admin}
      CONQUEST_ADMIN_SECRET: ${CONQUEST_ADMIN_SECRET:-conquest-admin-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - conquest_network

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: prod
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - conquest_network

volumes:
  pgdata:

networks:
  conquest_network:
    driver: bridge
