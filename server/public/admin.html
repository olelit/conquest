<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conquest Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #14141a; color: #eee; font-family: system-ui, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin: 24px 0 8px; color: #bbb; }
  .card { background: #1e1e24; border: 1px solid #333; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2a31; }
  th { color: #999; font-weight: 600; }
  button { background: #2196f3; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  button.ghost { background: #2a2a31; border: 1px solid #555; }
  button:hover { filter: brightness(1.15); }
  input { background: #14141a; border: 1px solid #555; color: #fff; border-radius: 6px; padding: 8px; font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #2a2a31; }
  .badge.playing { background: #2e7d32; }
  .badge.waiting { background: #555; }
  .err { color: #ff6b6b; }
  .ok { color: #69db7c; }
  pre { background: #0d0d12; border: 1px solid #333; border-radius: 8px; padding: 10px; overflow: auto; max-height: 70vh; font-size: 12px; }
  .note { color: #999; font-size: 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { background: #2a2a31; border: 1px solid #555; }
  .tab.active { background: #2196f3; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { color: #999; font-size: 12px; }
  .fb-unread { font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Conquest Admin</h1>
  <div id="tabs" class="tabs" style="display:none">
    <button class="tab active" data-tab="overview">Обзор</button>
    <button class="tab" data-tab="account">Аккаунт</button>
    <button class="tab" data-tab="feedback">Отзывы</button>
  </div>
  <div id="view"></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
let statusTimer = null;
let selectedDump = null;
let currentTab = 'overview';
let meUsername = '';

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 401) throw new Error('UNAUTHORIZED');
  return res.json();
}

async function refreshMe() {
  return api('/api/admin/me');
}

function renderLogin() {
  $('#view').innerHTML = `
    <div class="card" style="max-width:340px">
      <h2>Вход</h2>
      <div class="row" style="flex-direction:column;align-items:stretch">
        <input id="u" placeholder="Логин" autocomplete="username">
        <input id="p" type="password" placeholder="Пароль" autocomplete="current-password">
        <button id="login">Войти</button>
      </div>
      <div id="err" class="err"></div>
    </div>`;
  $('#login').onclick = async () => {
    const u = $('#u').value.trim();
    const p = $('#p').value;
    $('#err').textContent = '';
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      });
      const r = await res.json().catch(() => ({}));
      if (res.ok && r.ok) { boot(); return; }
      $('#err').textContent = r.error || (res.status === 401 ? 'Неверный логин или пароль' : 'Ошибка сервера');
    } catch (e) {
      $('#err').textContent = 'Ошибка сети';
    }
  };
}

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function showTabs() {
  $('#tabs').style.display = 'flex';
  document.querySelectorAll('#tabs .tab').forEach((b) => {
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
}

function bindTabs() {
  document.querySelectorAll('#tabs .tab').forEach((b) => {
    b.onclick = () => switchTab(b.dataset.tab);
  });
}

function switchTab(tab) {
  currentTab = tab;
  stopPoll();
  showTabs();
  if (tab === 'account') renderAccount();
  else if (tab === 'feedback') renderFeedback();
  else renderDashboard();
}

function renderAccount() {
  $('#view').innerHTML = `
    <div class="card" style="max-width:420px">
      <h2>Аккаунт</h2>
      <div class="field"><label>Логин</label><input id="cur-login" value="${esc(meUsername)}" disabled></div>
      <div class="field"><label>Текущий пароль</label><input id="cur-pass" type="password" autocomplete="current-password"></div>
      <div class="field"><label>Новый логин (необязательно)</label><input id="new-login" autocomplete="off"></div>
      <div class="field"><label>Новый пароль (необязательно)</label><input id="new-pass" type="password" autocomplete="new-password"></div>
      <div class="row" style="margin-top:12px">
        <button id="save-creds">Сохранить</button>
        <span id="creds-msg" class="note"></span>
      </div>
    </div>`;
  $('#save-creds').onclick = async () => {
    const msg = $('#creds-msg');
    msg.className = 'note';
    msg.textContent = 'Сохранение…';
    let res;
    try {
      res = await fetch('/api/admin/credentials', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          currentPassword: $('#cur-pass').value,
          newLogin: $('#new-login').value.trim() || undefined,
          newPassword: $('#new-pass').value || undefined,
        }),
      });
    } catch (e) {
      msg.className = 'err';
      msg.textContent = 'Ошибка сети';
      return;
    }
    const r = await res.json().catch(() => ({}));
    if (res.ok && r.ok) { boot(); return; }
    msg.className = 'err';
    msg.textContent = r.error || (res.status === 401 ? 'Сессия истекла' : 'Ошибка');
  };
}

async function renderFeedback() {
  $('#view').innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h2>Отзывы</h2>
      <button class="ghost" id="fb-refresh">Обновить</button>
    </div>
    <div class="card"><table>
      <thead><tr><th>#</th><th>Когда</th><th>IP</th><th>Текст</th><th></th><th></th></tr></thead>
      <tbody id="fb-rows"></tbody>
    </table></div>
    <div id="fb-msg" class="note"></div>`;
  $('#fb-refresh').onclick = () => loadFeedback();
  await loadFeedback();
}

async function loadFeedback() {
  const tbody = $('#fb-rows');
  const msg = $('#fb-msg');
  if (!tbody) return;
  msg.className = 'note';
  msg.textContent = 'Загрузка…';
  try {
    const r = await api('/api/admin/feedback');
    const list = (r && Array.isArray(r.feedback) ? r.feedback : []);
    msg.textContent = '';
    tbody.innerHTML = list.map((f) => `
      <tr class="${f.read ? '' : 'fb-unread'}">
        <td>#${f.id}</td>
        <td>${new Date(f.createdAt).toLocaleString()}</td>
        <td>${esc(f.ip)}</td>
        <td>${esc(f.text)}</td>
        <td>${f.read ? '<span class="note">прочитано</span>' : ''}</td>
        <td style="white-space:nowrap">
          ${f.read ? '' : `<button class="ghost" data-read="${f.id}">Прочитано</button>`}
          <button class="ghost" data-del="${f.id}">Удалить</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="6" class="note">Отзывов нет</td></tr>';
    tbody.querySelectorAll('[data-read]').forEach((btn) => {
      btn.onclick = async () => {
        await api('/api/admin/feedback/' + btn.dataset.read + '/read', { method: 'POST' });
        await loadFeedback();
      };
    });
    tbody.querySelectorAll('[data-del]').forEach((btn) => {
      btn.onclick = async () => {
        await api('/api/admin/feedback/' + btn.dataset.del, { method: 'DELETE' });
        await loadFeedback();
      };
    });
  } catch (e) {
    if (e.message === 'UNAUTHORIZED') { boot(); return; }
    msg.className = 'err';
    msg.textContent = 'Ошибка загрузки';
  }
}

function renderStatus(data) {
  $('#online').textContent = String(data.online);
  const rows = data.players.map((p) => `
    <tr>
      <td>${esc(p.name)}</td>
      <td>${p.email ? esc(p.email) : '—'}</td>
      <td>${p.roomName ? esc(p.roomName) + ' <span class="badge ' + esc(p.roomStatus) + '">' + esc(p.roomStatus) + '</span>' : 'лобби'}</td>
      <td>${p.isHost ? 'хост' : ''}</td>
      <td>${new Date(p.connectedAt).toLocaleTimeString()}</td>
    </tr>`).join('');
  $('#players').innerHTML = rows || '<tr><td colspan="5" class="note">Нет подключений</td></tr>';
}

function renderRooms(data) {
  const rooms = data.rooms.map((r) => `
    <div class="card">
      <div class="row">
        <strong>${esc(r.name)}</strong>
        <span class="badge ${esc(r.status)}">${esc(r.status)}</span>
        <span class="badge">${esc(r.mapType)}</span>
        <span class="note">люди: ${r.humans} / слотов: ${r.slots}${r.aiMode ? ' · ИИ' : ''}${r.paused ? ' · пауза' : ''}</span>
      </div>
      <div class="row" style="margin-top:8px">
        <input id="note-${r.id}" placeholder="Заметка (необязательно)" style="flex:1;min-width:200px">
        <button class="ghost" data-dump="${r.id}">Дамп</button>
      </div>
      <div id="msg-${r.id}" class="note"></div>
    </div>`).join('');
  $('#rooms').innerHTML = rooms || '<p class="note">Нет комнат</p>';
  document.querySelectorAll('[data-dump]').forEach((btn) => {
    btn.onclick = async () => {
      const id = Number(btn.dataset.dump);
      const note = $('#note-' + id).value.trim();
      const msg = $('#msg-' + id);
      msg.className = 'note';
      msg.textContent = 'Сохранение…';
      try {
        const r = await api('/api/admin/rooms/' + id + '/dump', { method: 'POST', body: JSON.stringify({ note }) });
        if (r.ok) { msg.className = 'ok'; msg.textContent = 'Сохранено (id=' + r.id + ')'; loadDumps(); }
        else { msg.className = 'err'; msg.textContent = r.error; }
      } catch (e) { msg.className = 'err'; msg.textContent = 'Ошибка'; }
    };
  });
}

async function renderDashboard() {
  $('#view').innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h2 id="welcome">Панель администратора</h2>
      <button class="ghost" id="logout">Выйти</button>
    </div>
    <h2>Игроки онлайн: <span id="online">0</span></h2>
    <div class="card"><table><thead><tr><th>Имя</th><th>Email</th><th>Комната</th><th>Роль</th><th>Соединён</th></tr></thead><tbody id="players"></tbody></table></div>
    <h2>Комнаты</h2>
    <div id="rooms"></div>
    <h2>Дампы</h2>
    <div class="card"><table><thead><tr><th>#</th><th>Комната</th><th>Карта</th><th>Заметка</th><th>Когда</th><th></th></tr></thead><tbody id="dumps"></tbody></table></div>
    <div id="dump-view"></div>
    <h2>Пользователи</h2>
    <div class="card"><table><thead><tr><th>Имя</th><th>Email</th><th>Первый вход</th><th>Последний вход</th></tr></thead><tbody id="users"></tbody></table></div>`;
  $('#logout').onclick = async () => { await api('/api/admin/logout', { method: 'POST' }); stopPoll(); boot(); };
  showTabs();
  let status = { online: 0, players: [], rooms: [] };
  try {
    const r = await api('/api/admin/status');
    if (r && Array.isArray(r.players) && Array.isArray(r.rooms)) status = r;
  } catch (e) {
    if (e.message === 'UNAUTHORIZED') { boot(); return; }
  }
  renderStatus(status);
  renderRooms(status);
  loadDumps();
  loadUsers();
  poll();
}

async function refreshPlayers() {
  const r = await api('/api/admin/status');
  if (r && Array.isArray(r.players)) renderStatus(r);
}

function poll() {
  if (statusTimer) clearInterval(statusTimer);
  const tick = async () => {
    try {
      await refreshPlayers();
    } catch (e) {
      if (e.message === 'UNAUTHORIZED') { stopPoll(); boot(); }
    }
  };
  tick();
  statusTimer = setInterval(tick, 2000);
}

async function loadDumps() {
  try {
    const r = await api('/api/admin/dumps');
    const list = r.dumps || [];
    $('#dumps').innerHTML = list.map((d) => `
      <tr>
        <td>#${d.id}</td>
        <td>${esc(d.roomName)}</td>
        <td>${esc(d.mapType)}</td>
        <td>${d.auto ? '<span class="badge">авто</span> ' : ''}${d.note ? esc(d.note) : '—'}</td>
        <td>${new Date(d.createdAt).toLocaleString()}</td>
        <td><button class="ghost" data-view="${d.id}">Открыть</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="note">Дампов нет</td></tr>';
    document.querySelectorAll('[data-view]').forEach((btn) => {
      btn.onclick = async () => {
        const r = await api('/api/admin/dumps/' + btn.dataset.view);
        selectedDump = r.dump;
        $('#dump-view').innerHTML = '<pre>' + esc(JSON.stringify(r.dump, null, 2)) + '</pre>';
        $('#dump-view').scrollIntoView();
      };
    });
  } catch (e) { /* 401 обрабатывается в poll */ }
}

async function loadUsers() {
  try {
    const r = await api('/api/admin/users');
    const list = r.users || [];
    $('#users').innerHTML = list.map((u) => `
      <tr>
        <td>${esc(u.name)}</td>
        <td>${esc(u.email)}</td>
        <td>${new Date(u.firstSeenAt).toLocaleString()}</td>
        <td>${new Date(u.lastSeenAt).toLocaleString()}</td>
      </tr>`).join('') || '<tr><td colspan="4" class="note">Нет входов</td></tr>';
  } catch (e) { /* 401 обрабатывается в poll */ }
}

function stopPoll() {
  if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
}

async function boot() {
  let me;
  try { me = await refreshMe(); } catch { me = { authenticated: false }; }
  if (me.authenticated) {
    meUsername = me.username || '';
    bindTabs();
    showTabs();
    renderDashboard();
  } else {
    meUsername = '';
    currentTab = 'overview';
    $('#tabs').style.display = 'none';
    renderLogin();
  }
}

boot();
</script>
</body>
</html>
